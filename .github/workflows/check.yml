name: 資料のチェック

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: リンク切れ
        run: python3 tools/check_links.py
      - name: カズマの手持ちのLvのずれ
        if: always()
        run: python3 tools/check_levels.py
