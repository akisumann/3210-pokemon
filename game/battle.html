<title>探検堂バトルシミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* layout: 夜のスタジアム。上に敵陣の札、まん中に場（敵は奥・自分は手前）、その下にメッセージ窓と指示メニュー。暗い一色の世界にしている */
:root{
  --night:#0a0f1c; --sky:#101b38; --stand:#18213f; --turf:#1d5a3b; --turf2:#226544;
  --panel:#131c30; --panel2:#1b2640; --line:#2c3a5c; --ink:#e8edf7; --sub:#9aa8c4;
  --paper:#fbf7ea; --paper-ink:#1b2236; --paper-line:#2a3456; --sys-ink:#8c5800;
  --gold:#f2c14e; --me:#5aaeff; --foe:#ff7a63; --good:#61d394; --bad:#ff6b6b;
  --f-pixel:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Meiryo",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
.app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button:hover:not(:disabled){border-color:var(--sub)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
select,input[type=text]{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.big{font-family:var(--f-pixel);font-size:1.15rem;background:var(--gold);color:#22180a;border-color:var(--gold);padding:10px 26px;letter-spacing:.06em}
.big:hover:not(:disabled){filter:brightness(1.08);border-color:var(--gold)}

/* 上のバー */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-pixel);font-size:1.35rem;letter-spacing:.08em;margin:0;margin-right:auto;color:var(--gold);text-shadow:0 2px 0 #5a3d00}
.logo small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--sub);letter-spacing:.04em;text-shadow:none}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{font-size:.85rem;padding:5px 12px}
.nav button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* タイトル（チームを選ぶ） */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.vs .mid{align-self:center;font-family:var(--f-pixel);font-size:2rem;color:var(--gold)}
.corner{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.corner.me{border-top:4px solid var(--me)} .corner.foe{border-top:4px solid var(--foe)}
.corner h2{margin:0;font-family:var(--f-pixel);font-size:1rem;font-weight:400;letter-spacing:.06em}
.corner.me h2{color:var(--me)} .corner.foe h2{color:var(--foe)}
.corner label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--sub)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.roster li{display:flex;align-items:center;gap:8px;background:var(--night);border-radius:8px;padding:6px 8px;min-width:0}
.roster small{color:var(--sub);margin-left:auto;font-size:.75rem;white-space:nowrap}
.dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),var(--c);flex:none}
.startbar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.hintline{font-size:.8rem;color:var(--sub);text-align:center;margin:0}
@media (max-width:640px){.vs{grid-template-columns:1fr}.vs .mid{justify-self:center;font-size:1.4rem}}

/* バトルの場 */
.strip{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--sub)}
.strip .tn{font-family:var(--f-pixel);font-size:.95rem;color:var(--ink)}
.strip.foe .tn{color:var(--foe)} .strip.me .tn{color:var(--me)}
.strip span.chip{border:1px solid var(--line);border-radius:99px;padding:0 9px}
.strip .kz{border-color:var(--gold);color:#22180a;background:var(--gold);font-weight:700;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 12px var(--gold)}}
.stage{position:relative;aspect-ratio:16/8.5;border-radius:14px;overflow:hidden;container-type:inline-size;border:2px solid var(--line);
  background:
   radial-gradient(60% 40% at 12% -5%,#fff3c455,transparent 70%),
   radial-gradient(60% 40% at 88% -5%,#fff3c455,transparent 70%),
   linear-gradient(var(--sky) 0 30%,var(--stand) 30% 40%,transparent 40%),
   repeating-linear-gradient(90deg,var(--turf) 0 7%,var(--turf2) 7% 14%)}
.stage::before{content:"";position:absolute;left:0;right:0;top:30%;height:10%;
  background:radial-gradient(circle,#ffffff22 1px,transparent 1.6px) 0 0/9px 7px;opacity:.9}
.stage::after{content:"";position:absolute;left:50%;top:40%;bottom:0;width:2px;background:#ffffff30;transform:skewX(-20deg)}
.plat{position:absolute;border-radius:50%;background:radial-gradient(closest-side,#ffffff38,#ffffff12 60%,transparent);z-index:1}
.plat.foe{right:9%;top:43%;width:30%;height:11%}
.plat.me{left:4%;bottom:3%;width:38%;height:14%}
.tok{position:absolute;z-index:2;aspect-ratio:1;display:grid;place-items:center}
.tok.foe{right:14%;top:15%;width:20%}
.tok.me{left:10%;bottom:9%;width:26%}
.orb{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,#ffffffb0,transparent 32%),radial-gradient(circle at 70% 75%,#00000055,transparent 55%),linear-gradient(135deg,var(--c1) 45%,var(--c2) 55%);
  box-shadow:0 0 0 .5cqw #0008,0 1.5cqw 2.5cqw #0007;animation:bob 2.4s ease-in-out infinite}
.orb span{font-family:var(--f-pixel);font-size:8cqw;color:#fff;text-shadow:0 .4cqw 0 #0009,0 0 1cqw #0006}
.tok.me .orb span{font-size:10cqw}
.tok[data-st="par"] .orb{box-shadow:0 0 0 .6cqw #f7d02c,0 1.5cqw 2.5cqw #0007}
.tok[data-st="brn"] .orb{box-shadow:0 0 0 .6cqw #ee8130,0 1.5cqw 2.5cqw #0007}
.tok[data-st="psn"] .orb,.tok[data-st="tox"] .orb{box-shadow:0 0 0 .6cqw #a33ea1,0 1.5cqw 2.5cqw #0007}
.tok[data-st="slp"] .orb{filter:saturate(.5) brightness(.8);animation-duration:5s}
.tok[data-st="frz"] .orb{box-shadow:0 0 0 .6cqw #bff3ff,0 1.5cqw 2.5cqw #0007;filter:hue-rotate(-20deg) saturate(.6) brightness(1.15);animation:none}
.tok.down{transform:translateY(35%);opacity:0;transition:transform .5s ease-in,opacity .5s ease-in}
.tok.empty{opacity:0}
.tok.hit{animation:hit .45s}
.tok.enter{animation:enter .45s ease-out}
.tok.me.atk{animation:atkMe .35s ease-out} .tok.foe.atk{animation:atkFoe .35s ease-out}
@keyframes bob{50%{transform:translateY(-3%)}}
@keyframes hit{0%,100%{transform:none;filter:none}15%{transform:translateX(-7%);filter:brightness(2.6)}35%{transform:translateX(6%);filter:none}55%{transform:translateX(-4%);filter:brightness(2)}75%{transform:translateX(2%)}}
@keyframes enter{from{transform:scale(.15);opacity:0;filter:brightness(4)}70%{transform:scale(1.06);filter:brightness(1.5)}to{transform:none}}
@keyframes atkMe{50%{transform:translate(10%,-8%) scale(1.04)}}
@keyframes atkFoe{50%{transform:translate(-10%,8%) scale(1.04)}}
.hud{position:absolute;z-index:3;width:min(44%,330px);background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-line);border-radius:10px;
  padding:.6cqw 1.2cqw;font-size:clamp(.62rem,1.5cqw,.9rem);line-height:1.45;box-shadow:0 .6cqw 0 #0006;display:flex;flex-direction:column;gap:.25em}
.hud.foe{left:2.5%;top:5%}
.hud.me{right:2.5%;bottom:6%}
.hud.empty{visibility:hidden}
.hud-top{display:flex;align-items:baseline;gap:.6em}
.hn{font-family:var(--f-pixel);font-size:1.3em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lv{font-family:var(--f-pixel)}
.hud-mid,.hud-bot{display:flex;flex-wrap:wrap;gap:.3em;align-items:center}
.ty{display:inline-block;background:var(--c);color:var(--ti,#141824);border-radius:4px;padding:0 .45em;font-size:.88em;font-weight:700;line-height:1.5}
.st{border-radius:4px;padding:0 .45em;font-size:.88em;color:#fff;background:#555}
.st-brn{background:#c95f15}.st-par{background:#b39200}.st-psn,.st-tox{background:#8a2f88}.st-slp{background:#5c6680}.st-frz{background:#2d8fa6}.st-cnf{background:#a0456a}
.hud-hit{font-family:var(--f-pixel);display:flex;gap:.5em;align-items:baseline;border-top:1px dashed #2a345655;padding-top:.15em}
.hud-hit .w{flex:1;min-width:0}
.hud-hit .w.dim{color:#6b7389}
.hud-hit .at{font-size:1.25em;color:#b0321f}
.balls{display:flex;gap:.25em;margin-right:auto}
.pb{width:.85em;height:.85em;border-radius:50%;border:1.5px solid var(--paper-line);background:linear-gradient(#e8443a 0 45%,var(--paper-line) 45% 55%,#fff 55%)}
.pb.down{background:#9aa0ad;opacity:.55}
.pb.on{outline:2px solid #e8a400;outline-offset:1px}
.stgc{font-size:.85em;border-radius:4px;padding:0 .35em;font-weight:700}
.stgc.up{background:#d8f3e3;color:#13603a}.stgc.dn{background:#fbe0dc;color:#962a1a}
.banner{position:absolute;z-index:5;left:0;right:0;top:42%;text-align:center;font-family:var(--f-pixel);font-size:6cqw;color:var(--gold);
  text-shadow:0 .5cqw 0 #5a3d00,0 0 2cqw #0009;pointer-events:none;opacity:0}
.banner.go{animation:ban .9s ease-out}
@keyframes ban{0%{opacity:0;transform:translateX(-30%)}25%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateX(30%)}}
@media (max-width:600px){.stage{aspect-ratio:4/3.3}.hud{width:54%}.tok.foe{width:24%;top:20%}.tok.me{width:30%}.plat.foe{top:46%}}

/* メッセージ窓 */
.msg{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--paper);color:var(--paper-ink);border:4px solid var(--paper-line);border-radius:12px;
  box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px #c9c2a8;padding:12px 16px;min-height:4.4em;font-family:var(--f-pixel);font-size:1.08rem;line-height:1.6}
.msg:hover:not(:disabled){border-color:var(--paper-line)}
.msg #msgText{flex:1;min-width:0;white-space:pre-wrap}
.msg #msgText.sys{color:var(--sys-ink)}
.msg .caret{align-self:flex-end;color:var(--paper-line);animation:blink .8s steps(2) infinite}
.msg .caret[hidden]{display:none}
@keyframes blink{50%{opacity:0}}
.msgctl{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.msgctl button{font-size:.78rem;padding:3px 10px}

/* 指示メニュー */
.menu{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ask{font-family:var(--f-pixel);font-size:1.05rem;margin:0}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tabs button{font-family:var(--f-pixel);font-size:.95rem;padding:8px 4px;background:var(--night)}
.tabs button[aria-selected="true"]{background:var(--gold);color:#22180a;border-color:var(--gold)}
.tabs button .n{display:block;font-family:var(--f-body);font-size:.68rem;opacity:.8}
.pane{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.pane{grid-template-columns:1fr}.tabs button{font-size:.8rem}}
.mv{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:2px solid color-mix(in srgb,var(--c) 75%,#000);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 34%,var(--panel)) ,color-mix(in srgb,var(--c) 12%,var(--panel)))}
.mv:hover:not(:disabled){border-color:var(--c);transform:translateY(-1px)}
.mv .mn{font-family:var(--f-pixel);font-size:1.12rem}
.mv .mi{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.76rem;color:var(--sub)}
.mv .mf{font-size:.74rem;color:var(--gold);min-height:1.1em}
.card{text-align:left;display:flex;gap:10px;align-items:center;padding:10px;background:var(--night)}
.card .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.card .t b{font-family:var(--f-pixel);font-weight:400;font-size:1.02rem}
.card .t small{color:var(--sub);font-size:.74rem}
.card.on{border-color:var(--me)}
.tog{text-align:left;display:flex;flex-direction:column;gap:2px;padding:9px 12px;background:var(--night)}
.tog b{font-family:var(--f-pixel);font-weight:400;font-size:1rem}
.tog small{color:var(--sub);font-size:.74rem}
.tog[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.tog[aria-pressed="true"] b{color:var(--gold)}
.plan{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--sub);border-top:1px solid var(--line);padding-top:8px}
.plan .pc{border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:1px 10px}
.plan .warn{color:var(--bad)}
.data{grid-column:1/-1;background:var(--night);border-radius:8px;padding:10px 12px;font-size:.82rem;display:flex;flex-direction:column;gap:4px}
.data h4{margin:0;font-family:var(--f-pixel);font-weight:400;font-size:.95rem}
.data ul{margin:0;padding-left:1.1em}
.data .dim{color:var(--sub)}

/* 結果 */
.result{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#05080fcc;padding:16px}
.result .box{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:26px 30px;text-align:center;display:flex;flex-direction:column;gap:12px;max-width:420px}
.result h2{margin:0;font-family:var(--f-pixel);font-weight:400;font-size:2.2rem;color:var(--gold)}
.result h2.lose{color:var(--sub)}
.result .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* 実況ログ */
.logp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:380px;overflow:auto;font-size:.84rem}
.logp p{margin:0 0 3px}
.logp .t{color:var(--gold);font-family:var(--f-pixel);margin-top:8px}
.logp .sys{color:#ffd98a}
.logp .spk{font-weight:700}

/* チームを作る */
.builder{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.builder h2{margin:0;font-family:var(--f-pixel);font-weight:400;font-size:1.15rem;color:var(--gold)}
.builder label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--sub)}
.tr{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.shi{display:flex;flex-wrap:wrap;gap:8px}
.shi span{font-family:var(--f-pixel);font-size:.9rem;padding:3px 12px;border-radius:8px;background:var(--night);border:1px solid var(--line)}
.derived,.note{font-size:.82rem;color:var(--sub);margin:0}
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.mon{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;background:var(--night);display:flex;flex-direction:column;gap:6px}
.mon .hd{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--sub)}
.mon .hd label{flex-direction:row;gap:4px;color:var(--ink);align-items:center}
.mon input[type=text]{width:100%;box-sizing:border-box}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.two select{width:100%}
.meter{display:grid;grid-template-columns:3.2em 1fr 4.8em;gap:6px;align-items:center;font-size:.8rem}
.meter input{width:100%;padding:0;accent-color:var(--gold)}
.meter b{font-family:var(--f-pixel);font-weight:400;text-align:right}
.sum{font-family:var(--f-pixel);font-size:.82rem}
.sum.bad{color:var(--bad)}
.go{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meta{font-size:.8rem;color:var(--sub)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <h1 class="logo">探検堂バトル<small>ルールブック第1版のバトルシミュレーター（3vs3）</small></h1>
    <nav class="nav">
      <button id="navTitle">チームを選ぶ</button>
      <button id="openB">チームを作る</button>
      <button id="navLog" aria-pressed="false" hidden>実況ログ</button>
    </nav>
  </header>

  <section id="title">
    <div class="vs">
      <div class="corner me">
        <h2>自陣</h2>
        <label>チーム<select id="myTeam"></select></label>
        <div class="row2">
          <label>「指示」<select id="myOrder"><option>C</option><option selected>B</option><option>A</option></select></label>
          <label>六令<select id="myMode"><option value="jk">熟達</option><option value="zk">全開（指示B以上）</option><option value="mix">混成（指示A）</option></select></label>
        </div>
        <ul class="roster" id="myRoster"></ul>
      </div>
      <div class="mid">VS</div>
      <div class="corner foe">
        <h2>敵陣</h2>
        <label>チーム<select id="foeTeam"></select></label>
        <div class="row2">
          <label>「指示」<select id="foeOrder"><option>C</option><option selected>B</option><option>A</option></select></label>
          <label>動かすのは<select id="foeCtl" disabled><option>相手AI（自分の型で動く）</option></select></label>
        </div>
        <ul class="roster" id="foeRoster"></ul>
      </div>
    </div>
    <div class="startbar" style="margin-top:14px"><button class="big" id="start">試合開始</button></div>
    <p class="hintline" style="margin-top:8px">体力は数字で出ません。受けたダメージの大きさと「＠（あと何発で倒れるか）」で読み合います。</p>
  </section>

  <section id="battle" hidden style="display:flex;flex-direction:column;gap:10px">
    <div class="strip foe" id="foeTag"></div>
    <div class="stage" id="stage">
      <div class="plat foe"></div><div class="plat me"></div>
      <div class="tok foe empty" id="foeTok"></div>
      <div class="tok me empty" id="meTok"></div>
      <div class="hud foe empty" id="foeHud"></div>
      <div class="hud me empty" id="meHud"></div>
      <div class="banner" id="banner"></div>
    </div>
    <div class="strip me" id="meTag"></div>
    <button class="msg" id="msg" aria-live="polite"><span id="msgText"></span><span class="caret" id="caret" hidden>▼</span></button>
    <div class="msgctl">
      <button id="autoBtn" aria-pressed="true">自動送り：オン</button>
      <button id="skipBtn">このTを早送り</button>
    </div>
    <section class="menu" id="menu" hidden>
      <p class="ask" id="ask"></p>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="pane" id="pane"></div>
      <div class="plan" id="plan"></div>
    </section>
    <section class="logp" id="logp" hidden></section>
  </section>

  <section class="builder" id="builder" hidden>
    <h2>チームを作る</h2>
    <div class="tr">
      <label>チーム名<input id="tName" type="text" value="オリジナル"></label>
      <label>トレーナー名<input id="tTrainer" type="text" value="わたし"></label>
      <button id="roll">資質のダイスを振る</button>
    </div>
    <div class="shi" id="shi"></div>
    <p class="derived" id="derived"></p>
    <label>『固有』（効果のメモ。バトルではまだ動きません）<input id="koyu" type="text" placeholder="例: 味方の『役割』の発動時、T終了時まで全体の場を「エレキフィールド」にする"></label>
    <p class="note">能力はメーター式です。1つを上げると、ほかの5つが少しずつ下がって、合計種族値の枠に収まります。「試合に出す」に印を付けた3体（印がなければ上から3体）で戦います。</p>
    <div class="mons" id="mons"></div>
    <div class="go"><button class="big" id="save">保存してバトルに使う</button><span class="meta" id="saveMsg"></span></div>

  const d=Math.max(1,m.status==="tox"?Math.floor(m.maxhp*m.toxN/16):Math.floor(m.maxhp/8));if(m.status==="tox")m.toxN=Math.min(15,m.toxN+1);
  m.hp=Math.max(0,m.hp-d);m.lastHit={w:word(d/m.maxhp),at:m.hp>0?Math.ceil(m.hp/d):0};L(B,"sys",`${m.name}は「${STN[m.status]}」のダメージを受けている！　「${word(d/m.maxhp)}」`);
  if(m.hp<=0){L(B,"sys",`◎―――――${m.name}は倒れた！`);m.fainted=true}});
 updKokozo(B);checkEnd(B);
}
function checkEnd(B){B.sides.forEach((s,i)=>{if(!B.over&&alive(s).length===0){B.over=true;B.winner=1-i;L(B,"sys",`◎―――――${B.sides[1-i].name}は${s.name}とのバトルに勝利した！`)}})}
/* ===== 相手の動き（型を持つAI） ===== */
const SLIP={C:.2,B:.1,A:.04};
function aiAct(B,si){const s=B.sides[si],o=B.sides[1-si],m=cur(s),e=cur(o);const a={};
 const lk=lockOf(m);let opts=m.moves.filter(n=>!lk||n===lk).map(n=>({n,v:expPct(B,si,1-si,MV[n])}));
 // 倒せるなら先制技を優先
 const meFaster=speed(B,si)>=speed(B,1-si);
 opts.forEach(x=>{const mv=MV[x.n];if(mv.cat==="st"){const r=m.hp/m.maxhp,st=STK.find(k=>fxArg(mv,k));
   if(hasFx(mv,"protect"))x.v=m.protectN?0:.05;else if(hasFx(mv,"heal"))x.v=r<.5?.45:r<.8?.1:0;
   else if(st){const ok=canStatus(e,st)&&!(mv.type==="電"&&e.types.includes("地"));x.v=ok?{slp:.4,par:meFaster?.12:.3,brn:e.st.a>e.st.c?.3:.1,tox:.25,psn:.2,frz:.3}[st]*mv.acc/100:0}
   else if(fxArg(mv,"cnf"))x.v=e.vol.cnf?0:.15;
   else x.v=m.stg.a+m.stg.c>=4||r<.5?.02:(r>.6&&!meFaster?.08:.15)}
  if(x.v*1.0>=e.hp/e.maxhp&&(mv.pri>0||meFaster))x.v+=1});
 opts.sort((x,y)=>y.v-x.v);let mv=opts[0].n;if(RNG()<SLIP[s.order]&&opts[1])mv=opts[1].n;a.move=mv;
 // 受けの判断
 const threat=Math.max(...e.moves.map(n=>expPct(B,1-si,si,MV[n])));const best=e.moves.map(n=>MV[n]).sort((x,y)=>expPct(B,1-si,si,y)-expPct(B,1-si,si,x))[0];
 const canKO=opts[0].v>=1;
 if(threat>=m.hp/m.maxhp&&!canKO){
  const bench=s.team.map((x,i)=>({x,i})).filter(o2=>!o2.x.fainted&&o2.i!==s.act);
  const safe=bench.map(b=>({i:b.i,r:eff(best.type,b.x.types)})).sort((p,q)=>p.r-q.r)[0];
  if(safe&&safe.r<=.5&&RNG()>SLIP[s.order]){a.switchTo=safe.i;delete a.move;if(!s.shikiUsed.modore&&ORD[s.order]>=1&&RNG()<.5)a.shiki="modore";}
  else if(!s.shikiUsed.taero&&RNG()>SLIP[s.order]*2)a.shiki="taero";
  else if(best.cat==="ph"&&!s.shikiUsed.kawase)a.shiki="kawase";else if(best.cat==="sp"&&!s.shikiUsed.yokero)a.shiki="yokero";
 }
 // 指令: 攻めは攻撃系、減っていれば回復
 if(a.move){const mv=MV[a.move];const mode=s.mode==="zk"?"zk":"jk";
  if(m.hp/m.maxhp<.45&&!s.used.h&&mode==="jk")a.order="h:jk";
  else if(mv.cat!=="st"){const k=mv.cat==="ph"?"a":"c";if(!s.used[k])a.order=`${k}:${mode}`;else if(!s.used.s&&!meFaster)a.order=`s:${mode}`}}
 return a}
function aiReplace(B,si){const s=B.sides[si],e=cur(B.sides[1-si]);const c=s.team.map((x,i)=>({x,i})).filter(o=>!o.x.fainted);
 c.forEach(o=>{s.act=o.i;o.v=Math.max(...o.x.moves.map(n=>expPct(B,si,1-si,MV[n])))});c.sort((p,q)=>q.v-p.v);return c[0].i}
if(typeof module!=="undefined")module.exports={newBattle,runTurn,aiAct,aiReplace,cur,alive,TEAMS,MV,setRNG:f=>RNG=f,doSwitch,onEnter,updKokozo,STN};
</script>

function hudHTML(sn,me){const m=sn.m;

/* --- メッセージを1行ずつ流す --- */

 if(shown>=B.log.length){done();return}

 if(e.cls==="t"){const b=$("banner");b.textContent=e.txt.replace(/[―\s]/g,"");b.classList.remove("go");void b.offsetWidth;b.classList.add("go");autoT=setTimeout(next,600);return}

  $("resD").textContent=win?`${B.sides[0].name}は${B.sides[1].name}とのバトルに勝利した！（${B.turn}T）`:`${B.sides[0].name}は${B.sides[1].name}に敗れた……（${B.turn}T）`;$("result").hidden=false;return}

 lg.innerHTML=B.log.slice(0,shown).map(e=>e.cls==="t"?`<p class="t">${e.txt}</p>`:e.spk?`<p><span class="spk">【${e.spk}】</span>${e.txt}</p>`:`<p class="${e.cls}">${e.txt}</p>`).join("");lg.scrollTop=lg.scrollHeight}

/* --- 指示メニュー --- */
const ON={a:"攻撃",b:"防御",c:"特攻",d:"特防",s:"敏捷",h:"回復"};
const SHIKI=[["kawase","かわせ！","物理技を1回だけ回避する"],["yokero","よけろ！","特殊技を1回だけ回避する"],["taero","たえろ！","ダメージを半減し、必ず体力1で耐える"],["modore","もどれ！","相手の行動のあとに交代する（ポケモンから交代先を選ぶ）"]];
function drawMenu(){const s=B.sides[0],m=cur(s),need=m.fainted;$("menu").hidden=false;
 $("ask").textContent=need?"次に出すポケモンを選んでください。":pendingU?`「${pendingU}」のあとに出すポケモンを選んでください。`:`T${B.turn+1}　${m.name}は　どうする？`;
 const T=[["fight","たたかう",""],["party","ポケモン",`${alive(s).length}/${s.team.length}`],["order","指令",`残り${6-["a","b","c","d","s","h"].filter(k=>s.used[k]).length}`],["shiki","四式",`残り${4-Object.keys(s.shikiUsed).length}`],["dex","図鑑",`残り${s.dex}`]];

 if(tab==="party"){p.innerHTML=s.team.map((x,j)=>{const on=j===s.act&&!x.fainted;const dis=x.fainted||j===s.act;
   const sub=x.fainted?"ひんし":on?"場に出ている":[x.status?STN[x.status]:"",x.lastHit?`${x.lastHit.w}＠${x.lastHit.at}`:"ダメージなし"].filter(Boolean).join("　");
   return `<button class="card${on?" on":""}" data-sw="${j}"${dis?" disabled":""}><span class="dot" style="--c:${TC[x.types[0]]};width:30px;height:30px"></span><span class="t"><b>${x.name}</b><small>${x.types.map(t=>TN[t]).join("・")}${x.role?"　『"+x.role+"』":""}　${x.item}</small><small>${sub}</small></span></button>`}).join("")
   +(pendingU?`<button class="tog" data-u="auto"><b>おまかせ</b><small>相手に一番通りそうな子を出す</small></button><button class="tog" data-u="cancel"><b>やめる</b><small>技を選び直す</small></button>`:"")}
 if(tab==="order"){const modes=s.mode==="mix"?["jk","zk"]:[s.mode];let h="";
  ["a","b","c","d","s","h"].forEach(k=>modes.forEach(md=>{const v=`${k}:${md}`,used=s.used[k];
   const d=md==="zk"?(k==="h"?"行動をスキップして体力を1/2回復":"1Tの間、能力が2倍"):(k==="h"?"体力を1/4回復":"能力ランク+1");
   h+=`<button class="tog" data-ord="${v}" aria-pressed="${plan.order===v}"${used?" disabled":""}><b>『${md==="zk"?"全開":"熟達"}${ON[k]}指令』</b><small>${used?"使用済み":d}</small></button>`}));p.innerHTML=h}
 if(tab==="shiki")p.innerHTML=SHIKI.map(([k,l,d])=>`<button class="tog" data-sk="${k}" aria-pressed="${plan.shiki===k}"${s.shikiUsed[k]?" disabled":""}><b>『${l}』</b><small>${s.shikiUsed[k]?"使用済み":d}</small></button>`).join("");
 if(tab==="dex"){const f=cur(B.sides[1]);
  const foe=f.dexed?`<div class="data"><h4>${f.name}（解析済み）</h4><span>${f.types.map(ty).join(" ")}　Lv${f.lv}　${f.role?"『"+f.role+"』":"『役割』なし"}　持ち物：${f.item}</span><ul>${f.moves.map(n=>`<li>${n}　<span class="dim">${TN[MV[n].type]}・${CATN[MV[n].cat]}${MV[n].pow?"・威力"+MV[n].pow:""}${fxNote(MV[n])?"・"+fxNote(MV[n]):""}</span></li>`).join("")}</ul></div>`
   :`<div class="data"><h4>${f.name}</h4><span class="dim">${f.types.map(t=>TN[t]).join("・")}。図鑑で解析すると、技・持ち物・『役割』が見えます（指示を出す前に使えて、Tは消費しません）。</span></div>`;
  p.innerHTML=`<button class="tog" id="dexGo"${s.dex<=0||f.dexed?" disabled":""}><b>図鑑で解析する</b><small>残り${s.dex}回${f.dexed?"（この相手は解析済み）":""}</small></button><div></div>`+foe

 const parts=[plan.order?`<span class="pc">『${plan.order.endsWith("zk")?"全開":"熟達"}${ON[plan.order[0]]}指令』</span>`:"",plan.shiki?`<span class="pc">『${SHIKI.find(x=>x[0]===plan.shiki)[1]}』</span>`:""].filter(Boolean);
 $("plan").innerHTML=need?"":`<span>一緒に出す：</span>${parts.join("")||"なし（指令・四式のタブで選べます）"}${plan.shiki==="modore"?'<span class="warn">『もどれ！』は「ポケモン」から交代先を選んで出します</span>':""}<span style="margin-left:auto">技を押すか、交代先を押すと指示が出ます</span>`}
$("tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b||b.disabled)return;tab=b.dataset.tab;drawMenu()};
$("pane").onclick=e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const s=B.sides[0],m=cur(s);
 if(b.dataset.mv){const n=b.dataset.mv;if(plan.shiki==="modore"){tab="party";drawMenu();return}
  if(hasFx(MV[n],"uturn")&&alive(s).length>1){pendingU=n;tab="party";drawMenu();return}commit({move:n});return}
 if(b.dataset.u){if(b.dataset.u==="cancel"){pendingU=null;tab="fight";drawMenu();return}const n=pendingU;pendingU=null;commit({move:n});return}
 if(b.dataset.sw!=null){const j=+b.dataset.sw;
  if(m.fainted){s.act=j;onEnter(B,0,cur(s));updKokozo(B);tab="fight";play();return}
  if(pendingU){const n=pendingU;pendingU=null;commit({move:n,uturnTo:j});return}commit({switchTo:j});return}
 if(b.dataset.ord){plan.order=plan.order===b.dataset.ord?"":b.dataset.ord;drawMenu();return}

 if(b.id==="dexGo"){if(s.dex<=0)return;s.dex--;cur(B.sides[1]).dexed=true;L(B,"sys",`◎${s.name}は「ポケモン図鑑」を使用し、相手のデータを解析した！`);play()}};
function commit(a){if(plan.order)a.order=plan.order;if(plan.shiki)a.shiki=plan.shiki;plan={order:"",shiki:""};tab="fight";
 const f=aiAct(B,1);runTurn(B,[a,f]);
 if(!B.over&&cur(B.sides[1]).fainted){const to=aiReplace(B,1);B.sides[1].act=to;onEnter(B,1,cur(B.sides[1]));updKokozo(B)}
 B.sides[1].team[B.sides[1].act].seen=true;play()}

/* --- 試合を始める --- */
function start(){
 const mt=TEAMS[$("myTeam").value],ft=TEAMS[$("foeTeam").value];let mode=$("myMode").value;const mo=$("myOrder").value;
 if(mo==="C")mode="jk";if(mo==="B"&&mode==="mix")mode="zk";
 const fo=ft.shi?ft.shi["指示"]:$("foeOrder").value;
 B=newBattle({sides:[{trainer:mt.trainer,team:mt,order:mo,mode,ikusei:mt.shi?mt.shi["育成"]:"C"},{trainer:ft.trainer,team:ft,order:fo,mode:fo==="C"?"jk":(fo==="A"?"mix":"zk"),ikusei:ft.shi?ft.shi["育成"]:"C",ai:true}]});
 shown=0;tab="fight";plan={order:"",shiki:""};pendingU=null;$("result").hidden=true;
 ["meTok","foeTok"].forEach(k=>{$(k).dataset.key="";$(k).className=`tok ${k.startsWith("me")?"me":"foe"} empty`;$(k).innerHTML=""});
 L(B,"sys",`◎―――――${ft.trainer}が勝負を仕掛けて来た！（3vs3）`);
 onEnter(B,1,cur(B.sides[1]));cur(B.sides[1]).seen=true;onEnter(B,0,cur(B.sides[0]));updKokozo(B);
 show("battle");play()}
$("start").onclick=start;
$("again").onclick=start;
$("back").onclick=()=>{$("result").hidden=true;show("title");drawRosters()};
/* ===== チームを作る ===== */
const BUDGET=[450,500,500,550,550,600],SK=["h","a","b","c","d","s"],SN={h:"体力",a:"攻撃",b:"防御",c:"特攻",d:"特防",s:"素早"};
const ROLE_BASE=["","不動のエース","エースアシストα","エースキラーα","鬼人","魔術師","狂走"];
function rankOf(v){if(v>=200)return"S";for(const [r,[lo,hi]] of Object.entries(RANKV)){if(r==="S")continue;if(v===lo&&lo===hi)return r;}
 for(const [r,[lo,hi]] of Object.entries(RANKV)){if(r==="S"||lo===hi)continue;if(v>=lo&&v<=hi)return r}
 if(v>195)return"AAA+";return"E-"}
function blankMon(i){const per=Math.floor(BUDGET[i]/6/5)*5;const b={};SK.forEach(k=>b[k]=per);b.h+=BUDGET[i]-per*6;
 return {name:`ポケモン${i+1}`,types:["ノ",""],b,moves:["すてみタックル","でんこうせっか","まもる","つるぎのまい"],item:"なし",role:"",use:i<3}}
let CT=null;
function newCT(){CT={name:$("tName").value,trainer:$("tTrainer").value,shi:null,mons:BUDGET.map((_,i)=>blankMon(i))}}
function roll(){const ks=["指示","育成","統率","能力"];const a=ks.splice(Math.floor(Math.random()*4),1)[0];const b=ks.splice(Math.floor(Math.random()*3),1)[0];
 CT.shi={[a]:"A",[b]:"B",[ks[0]]:"C",[ks[1]]:"C"};drawB()}
function rolesFor(i){const t=CT.shi?CT.shi["統率"]:"C";let r=[...ROLE_BASE];if(t==="A")r.push("二枚看板");
 if(t==="B"){const other=CT.mons.some((m,j)=>j!==i&&m.role==="二枚看板");if(!other)r.push("二枚看板")}return r}
function meterMove(i,k,v){const m=CT.mons[i];v=Math.round(v/5)*5;let d=v-m.b[k];m.b[k]=v;
 let others=SK.filter(x=>x!==k),guard=0;while(d!==0&&guard++<400){const step=d>0?-5:5;const cand=others.filter(x=>step<0?m.b[x]>10:m.b[x]<230);if(!cand.length)break;
  cand.sort((p,q)=>step<0?m.b[q]-m.b[p]:m.b[p]-m.b[q]);m.b[cand[0]]+=step;d+=step;}
 if(d!==0)m.b[k]-=d;}
// 技の選択肢を分類ごとにまとめる（タイプ一致の攻撃／先制技／積み技／守り・回復／そのほかの攻撃（タイプ別））
function moveGroups(types){const all=Object.values(MV),own=types.filter(Boolean);
 const atk=all.filter(v=>v.cat!=="st"),g=[["タイプ一致の攻撃",atk.filter(v=>own.includes(v.type)&&v.pri<=0)],["先制技",atk.filter(v=>v.pri>0)],
  ["積み技",all.filter(v=>v.cat==="st"&&fxs(v).some(t=>t.startsWith("up:")))],["状態異常にする技",all.filter(v=>v.cat==="st"&&(STK.some(k=>fxArg(v,k))||fxArg(v,"cnf")))],["守り・回復",all.filter(v=>hasFx(v,"protect")||hasFx(v,"heal"))]];
 TYPES.filter(t=>!own.includes(t)).forEach(t=>g.push([`そのほかの攻撃（${TN[t]}）`,atk.filter(v=>v.type===t&&v.pri<=0)]));
 return g.filter(x=>x[1].length).map(([k,v])=>[k,v.map(x=>x.name)])}
function drawB(){const sh=CT.shi;$("shi").innerHTML=sh?Object.entries(sh).map(([k,v])=>`<span>${k}：${v}</span>`).join(""):"<span>まだ振っていません</span>";
 if(sh){const type={指示:"指示型",育成:"育成型",統率:"統率型",能力:"能力型"}[Object.keys(sh).find(k=>sh[k]==="A")];
  $("derived").textContent=`${type}。レベルは全員Lv${LV[sh["育成"]]}。図鑑${{C:1,B:2,A:3}[sh["指示"]]}回、六令は${{C:"熟達",B:"全開か熟達（一括）",A:"混成"}[sh["指示"]]}。『役割』は${{C:"基本の4つ",B:"基本の4つ＋『追加役割』1体",A:"9つ"}[sh["統率"]]}。『専用』は${{C:3,B:"4〜5",A:6}[sh["能力"]]}体まで（このバトルではまだ動きません）。`}
 else $("derived").textContent="資質のダイスを振ると、レベル・図鑑の回数・使える『役割』が決まります。";
 const box=$("mons");box.innerHTML="";
 CT.mons.forEach((m,i)=>{const d=document.createElement("div");d.className="mon";const sum=SK.reduce((a,k)=>a+m.b[k],0);
  const tsel=(v,id)=>`<select data-i="${i}" data-f="${id}">${id==="t2"?'<option value="">（なし）</option>':""}${TYPES.map(t=>`<option value="${t}"${t===v?" selected":""}>${TN[t]}</option>`).join("")}</select>`;
  const msel=(j)=>`<select data-i="${i}" data-f="m${j}">${moveGroups(m.types).map(([g,ns])=>`<optgroup label="${g}">${ns.map(n=>`<option value="${n}"${n===m.moves[j]?" selected":""}>${n}${fxNote(MV[n])?"（"+fxNote(MV[n])+"）":""}</option>`).join("")}</optgroup>`).join("")}</select>`;
  d.innerHTML=`<div class="hd"><span>枠 合計${BUDGET[i]}</span><label class="check" style="flex-direction:row;gap:4px;color:var(--ink)"><input type="checkbox" data-i="${i}" data-f="use"${m.use?" checked":""}>試合に出す</label></div>
  <input type="text" data-i="${i}" data-f="name" value="${m.name.replace(/"/g,"&quot;")}" aria-label="名前">
  <div class="two">${tsel(m.types[0],"t1")}${tsel(m.types[1],"t2")}</div>
  ${SK.map(k=>`<div class="meter"><span>${SN[k]}</span><input type="range" min="10" max="230" step="5" value="${m.b[k]}" data-i="${i}" data-f="b_${k}" aria-label="${SN[k]}"><b>${rankOf(m.b[k])} ${m.b[k]}</b></div>`).join("")}
  <div class="sum${sum!==BUDGET[i]?" bad":""}">合計 ${sum} / ${BUDGET[i]}</div>
  <div class="two">${[0,1,2,3].map(msel).join("")}</div>
  <div class="two"><select data-i="${i}" data-f="item">${ITEMS.map(x=>`<option${x===m.item?" selected":""}>${x}</option>`).join("")}</select>
  <select data-i="${i}" data-f="role">${rolesFor(i).map(r=>`<option value="${r}"${r===m.role?" selected":""}>${r||"『役割』なし"}</option>`).join("")}</select></div>`;
  box.appendChild(d)});}
$("mons").addEventListener("input",e=>{const t=e.target,i=+t.dataset.i,f=t.dataset.f;if(f===undefined)return;const m=CT.mons[i];
 if(f.startsWith("b_")){meterMove(i,f.slice(2),+t.value);updMon(i);return}
 if(f==="name"){m.name=t.value;return}if(f==="t1")m.types[0]=t.value;if(f==="t2")m.types[1]=t.value;if(f[0]==="m"&&f.length===2)m.moves[+f[1]]=t.value;
 if(f==="item")m.item=t.value;if(f==="role")m.role=t.value;if(f==="use")m.use=t.checked;drawB()});
function updMon(i){const m=CT.mons[i];SK.forEach(k=>{const el=document.querySelector(`[data-i="${i}"][data-f="b_${k}"]`);if(!el)return;if(+el.value!==m.b[k])el.value=m.b[k];el.nextElementSibling.textContent=`${rankOf(m.b[k])} ${m.b[k]}`});
 const sum=SK.reduce((a,k)=>a+m.b[k],0);const box=document.querySelectorAll("#mons .mon")[i].querySelector(".sum");box.textContent=`合計 ${sum} / ${BUDGET[i]}`;box.classList.toggle("bad",sum!==BUDGET[i])}
$("roll").onclick=roll;
$("openB").onclick=()=>{show("builder");if(!CT){newCT();drawB()}};
function loadSaved(){try{return JSON.parse(localStorage.getItem("tankendo-teams")||"[]")}catch(e){return[]}}
function registerSaved(){for(const t of loadSaved()){const key="★"+t.name;if(TEAMS[key])continue;TEAMS[key]=toTeam(t);$("myTeam").add(new Option(key,key));$("foeTeam").add(new Option(key,key))}}
function toTeam(t){let use=t.mons.filter(m=>m.use);if(use.length<3)use=t.mons.slice(0,3);use=use.slice(0,3);
 return {trainer:t.trainer,shi:t.shi,mons:use.map(m=>({name:m.name,types:m.types.filter(Boolean),b:m.b,moves:m.moves,item:m.item,role:m.role}))}}
$("save").onclick=()=>{if(!CT.shi){$("saveMsg").textContent="先に資質のダイスを振ってください。";return}
 CT.name=$("tName").value||"オリジナル";CT.trainer=$("tTrainer").value||"わたし";CT.koyu=$("koyu").value;
 const all=loadSaved().filter(t=>t.name!==CT.name);all.push(JSON.parse(JSON.stringify(CT)));try{localStorage.setItem("tankendo-teams",JSON.stringify(all))}catch(e){}
 const key="★"+CT.name;TEAMS[key]=toTeam(CT);if(![...$("myTeam").options].some(o=>o.value===key)){$("myTeam").add(new Option(key,key));$("foeTeam").add(new Option(key,key))}
 $("myTeam").value=key;$("myTeam").dispatchEvent(new Event("change"));$("saveMsg").textContent=`「${key}」を保存しました。「チームを選ぶ」の自陣・敵陣のどちらでも使えます（このブラウザだけに保存されます）。`};
$("myTeam").addEventListener("change",()=>{const t=TEAMS[$("myTeam").value];if(t.shi){$("myOrder").value=t.shi["指示"]}});
registerSaved();
drawRosters();
</script>
