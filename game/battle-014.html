<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>潮田渚とのバトル</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1d1f; --sub: #6b6b70; --line: #d9d6cf;
    --good: #3a9a5b; --mid: #d8a42b; --low: #c9473f; --accent: #3b5bab; --btn: #eef1f8; --sel: #dfe7ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181b; --panel: #222429; --ink: #ececef; --sub: #a0a0a8; --line: #3a3c43;
      --accent: #8ea8ff; --btn: #2c3040; --sel: #34406a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181b; --panel: #222429; --ink: #ececef; --sub: #a0a0a8; --line: #3a3c43;
    --accent: #8ea8ff; --btn: #2c3040; --sel: #34406a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; line-height: 1.6; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.15rem; margin: 4px 0 2px; }
  h2 { font-size: 1rem; margin: 14px 0 6px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 700; }
  .meta { color: var(--sub); font-size: .82rem; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; width: 100%; background: var(--good); transition: width .3s; }
  .tags { font-size: .8rem; color: var(--sub); min-height: 1.2em; }
  .balls { font-size: .8rem; color: var(--sub); }
  #log { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    height: 320px; overflow-y: auto; font-size: .92rem; margin-bottom: 10px; }
  #log p { margin: 0 0 5px; white-space: pre-wrap; }
  #log .sys { color: var(--accent); }
  #log .turn { color: var(--sub); font-size: .8rem; border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 8px; }
  #log .dex { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; background: var(--bg); padding: 6px 8px; border-radius: 6px; }
  .cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { font: inherit; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--btn); color: var(--ink); cursor: pointer; text-align: left; }
  button small { display: block; color: var(--sub); font-size: .75rem; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--sel); border-color: var(--accent); }
  .wide { grid-column: 1 / -1; text-align: center; }
  .pick { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .mon { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .mon.on { border-color: var(--accent); background: var(--sel); }
  .mon .stats { font-size: .8rem; color: var(--sub); }
  select { font: inherit; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); max-width: 100%; }
  label { font-size: .85rem; }
  .note { color: var(--sub); font-size: .78rem; margin-top: 14px; }
  .hide { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="ttl"></h1>
  <p class="lead" id="lead"></p>

  <!-- 戦闘前の準備 -->
  <section id="prep">
    <div class="panel">
      <h2 id="prepTtl"></h2>
      <p class="meta" id="prepNote"></p>
      <div class="pick" id="pickBox"></div>
      <div style="margin-top:10px"><label>先発：<select id="leadSel"></select></label></div>
      <div class="cmds" style="margin-top:12px">
        <button id="autoBtn"></button>
        <button id="goBtn">この準備でバトル開始</button>
      </div>
      <p class="meta" id="prepMsg"></p>
    </div>
  </section>

  <!-- バトル -->
  <section id="battle" class="hide">
    <div class="panel">
      <div class="row"><span class="name"><span id="eTr"></span>の <span id="eName"></span></span><span class="meta" id="eMeta"></span></div>
      <div class="bar"><div id="eBar"></div></div>
      <div class="row"><span class="tags" id="eTags"></span><span class="balls" id="eBalls"></span></div>
    </div>
    <div class="panel">
      <div class="row"><span class="name" id="pName"></span><span class="meta" id="pMeta"></span></div>
      <div class="bar"><div id="pBar"></div></div>
      <div class="row"><span class="tags" id="pTags"></span><span class="meta" id="pHp"></span></div>
      <div class="balls" id="pBalls"></div>
    </div>
    <div id="log"></div>
    <div class="cmds" id="cmds"></div>
  </section>

  <p class="note" id="note"></p>
</main>
