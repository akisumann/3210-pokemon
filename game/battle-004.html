<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>森の洋館の戦い</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1d1d1f; --sub: #6b6b70; --line: #d9d6cf;
    --hp-good: #3a9a5b; --hp-mid: #d8a42b; --hp-low: #c9473f; --accent: #3b5bab; --btn: #eef1f8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181b; --panel: #222429; --ink: #ececef; --sub: #a0a0a8; --line: #3a3c43;
      --accent: #8ea8ff; --btn: #2c3040;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181b; --panel: #222429; --ink: #ececef; --sub: #a0a0a8; --line: #3a3c43;
    --accent: #8ea8ff; --btn: #2c3040;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.15rem; margin: 4px 0 2px; }
  .lead { color: var(--sub); font-size: .9rem; margin: 0 0 12px; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 700; }
  .meta { color: var(--sub); font-size: .82rem; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; width: 100%; background: var(--hp-good); transition: width .35s; }
  .tags { font-size: .8rem; color: var(--sub); min-height: 1.2em; }
  #log { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    height: 300px; overflow-y: auto; font-size: .92rem; margin-bottom: 10px; }
  #log p { margin: 0 0 6px; }
  #log .sys { color: var(--accent); }
  #log .talk { }
  #log .turn { color: var(--sub); font-size: .8rem; border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 8px; }
  .cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { font: inherit; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--btn); color: var(--ink); cursor: pointer; text-align: left; }
  button small { display: block; color: var(--sub); font-size: .75rem; }
  button:disabled { opacity: .45; cursor: default; }
  .wide { grid-column: 1 / -1; text-align: center; }
  .note { color: var(--sub); font-size: .78rem; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>第4話　森の洋館 ― VS 野生のルサルカ</h1>
  <p class="lead">カズマがシンオウに来て3日目の夜。カズマの最初のポケモンバトル。</p>

  <section class="side">
    <div class="row"><span class="name">野生の <span id="eName">ルサルカ</span></span><span class="meta" id="eMeta">Lv20　タイプ：？？？</span></div>
    <div class="bar"><div id="eBar"></div></div>
    <div class="tags" id="eTags"></div>
  </section>

  <section class="side">
    <div class="row"><span class="name">ガッシュ</span><span class="meta">Lv20　でんき　特性：せいしんりょく</span></div>
    <div class="bar"><div id="pBar"></div></div>
    <div class="row"><span class="tags" id="pTags"></span><span class="meta" id="pHp"></span></div>
  </section>

  <div id="log"></div>
  <div class="cmds" id="cmds"></div>

  <p class="note">数値は資料のデータから（ガッシュとルサルカは005の最初の図鑑、Lv20）。ダメージの式は第五世代、レベルの項は22で固定、乱数0.85〜1.00、急所は2倍。ダメージの言葉と「＠」はスレの表示の決まりに合わせている。</p>
</main>

<script>
"use strict";
// ---- データ（005の図鑑。「+」は最大、「-」は最小、素のランクは中ほどをランダム） ----
const RANK = { "A+":135, "A-":110, "B+":105, "B-":90, "C+":85, "C-":60, "D+":55, "D-":40 };
const MID = { A:[120,125], B:[95,100], C:[70,75], D:[45,50] };
function base(r){ if (RANK[r] !== undefined) return RANK[r]; const m = MID[r]; return m[0] + Math.floor(Math.random()*(m[1]-m[0]+1)); }
const TYPES = { "でんき":{ "みず":2, "でんき":.5, "じめん":0, "くさ":.5, "ドラゴン":.5, "ひこう":2 },
  "エスパー":{ "かくとう":2, "どく":2, "エスパー":.5, "はがね":.5, "あく":0 },
  "ノーマル":{ "ゴースト":0, "いわ":.5, "はがね":.5 },
  "ゴースト":{ "ゴースト":2, "エスパー":2, "ノーマル":0, "あく":.5 },
  "みず":{ "ほのお":2, "じめん":2, "いわ":2, "みず":.5, "くさ":.5, "ドラゴン":.5 } };
function eff(mt, defTypes){ return defTypes.reduce((a,t)=> a * ((TYPES[mt]||{})[t] ?? 1), 1); }

const MOVES = {
  thunderbolt:{ name:"10まんボルト", type:"でんき", cat:"sp", pow:90, acc:100, sec:{ chance:10, eff:"par" } },
  zenhead:{ name:"しねんのずつき", type:"エスパー", cat:"ph", pow:80, acc:90, contact:true, sec:{ chance:20, eff:"flinch" } },
  swift:{ name:"スピードスター", type:"ノーマル", cat:"sp", pow:60, acc:null },
  charge:{ name:"じゅうでん", type:"でんき", cat:"st" },
  fakeout:{ name:"ねこだまし", type:"ノーマル", cat:"ph", pow:40, acc:100, prio:3, contact:true, sec:{ chance:100, eff:"flinch" } },
  shadowball:{ name:"シャドーボール", type:"ゴースト", cat:"sp", pow:80, acc:100, sec:{ chance:20, eff:"spd-1" } },
  waterpulse:{ name:"みずのはどう", type:"みず", cat:"sp", pow:60, acc:100, sec:{ chance:20, eff:"confuse" } },
  curse:{ name:"のろい", type:"ゴースト", cat:"st" },
  meanlook:{ name:"くろいまなざし", type:"ノーマル", cat:"st" },
};

function mon(o){
  const s = { atk:base(o.atk)+5, def:base(o.def)+5, spa:base(o.spa)+5, spd:base(o.spd)+5, spe:base(o.spe)+5 };
  const hp = base(o.hp)+60;
  return { ...o, s, max:hp, hp, st:{ atk:0, def:0, spa:0, spd:0, spe:0 }, status:null, confuse:0, cursed:false,
    charged:false, disabled:null, disabledTurns:0, flinch:false, lastDmg:0 };
}
let P, E, turn, over, lastMove, triedFlee, meanLooked, typeKnown, firstTurn;

function setup(){
  P = mon({ name:"ガッシュ", types:["でんき"], hp:"B", atk:"B", def:"C", spa:"A", spd:"C-", spe:"C",
    moves:["thunderbolt","zenhead","swift","charge"], ability:"せいしんりょく" });
  E = mon({ name:"ルサルカ", types:["ゴースト","みず"], hp:"B+", atk:"D-", def:"C", spa:"B+", spd:"A", spe:"D",
    moves:["fakeout","shadowball","waterpulse","curse","meanlook"], ability:"のろわれボディ", item:"きあいのハチマキ" });
  turn = 0; over = false; lastMove = null; triedFlee = false; meanLooked = false; typeKnown = false; firstTurn = true;
  document.getElementById("log").innerHTML = "";
  say("sys", "森の洋館の前。扉の陰から、何かが飛び出してきた！");
  say("talk", "凛が泡を吹いて倒れた。カズマ「……よし、弔い合戦だガッシュ！」");
  say("sys", "野生のルサルカが あらわれた！");
  render(); menu();
}

// ---- 表示 ----
function say(cls, text){ const p = document.createElement("p"); p.className = cls; p.textContent = text;
  const log = document.getElementById("log"); log.appendChild(p); log.scrollTop = log.scrollHeight; }
function stageTxt(m){ const n = { atk:"攻", def:"防", spa:"特攻", spd:"特防", spe:"速" };
  return Object.entries(m.st).filter(([,v])=>v).map(([k,v])=> n[k] + (v>0?"+":"") + v); }
function tags(m){ const t = stageTxt(m);
  if (m.status === "par") t.push("まひ"); if (m.confuse) t.push("こんらん"); if (m.cursed) t.push("のろい");
  if (m.charged) t.push("じゅうでん"); if (m.disabled) t.push("かなしばり：" + MOVES[m.disabled].name);
  return t.join("　"); }
function render(){
  for (const [m, id] of [[P,"p"],[E,"e"]]) {
    const r = m.hp / m.max, bar = document.getElementById(id+"Bar");
    bar.style.width = (r*100) + "%";
    bar.style.background = r > .5 ? "var(--hp-good)" : r > .2 ? "var(--hp-mid)" : "var(--hp-low)";
    document.getElementById(id+"Tags").textContent = tags(m);
  }
  document.getElementById("pHp").textContent = `体力 ${P.hp}/${P.max}`;
  document.getElementById("eMeta").textContent = "Lv20　タイプ：" + (typeKnown ? "ゴースト/みず" : "？？？");
}
function word(dmg, m, before){
  const f = dmg / m.max, after = Math.max(0, before - dmg);
  let w = f < 1/8 ? "微々たる" : f < 1/4 ? "小さな" : f < 1/3 ? "まずまずの" : f < 2/3 ? "大きな" : "特大の";
  if (after > 0 && after <= m.max/6) w = "深刻な";
  const at = after > 0 ? "＠" + Math.ceil(after / dmg) : "";
  return `${m.name}に ${w}ダメージ！ ${at}`.trim();
}

// ---- 計算 ----
const mult = s => s >= 0 ? (2+s)/2 : 2/(2-s);
function damage(a, d, mv){
  const crit = Math.random() < 1/16;
  const [ak, dk] = mv.cat === "ph" ? ["atk","def"] : ["spa","spd"];
  let as = a.st[ak], ds = d.st[dk];
  if (crit) { as = Math.max(0, as); ds = Math.min(0, ds); }
  const A = Math.floor(a.s[ak] * mult(as)), D = Math.floor(d.s[dk] * mult(ds));
  let pow = mv.pow; if (mv.type === "でんき" && a.charged) pow *= 2;
  let dmg = Math.floor(Math.floor(22 * pow * A / D) / 50) + 2;
  if (crit) dmg *= 2;
  dmg = Math.floor(dmg * (85 + Math.floor(Math.random()*16)) / 100);
  if (a.types.includes(mv.type)) dmg = Math.floor(dmg * 1.5);
  const e = eff(mv.type, d.types); dmg = Math.floor(dmg * e);
  return { dmg: e === 0 ? 0 : Math.max(1, dmg), crit, e };
}

function useMove(a, d, key){
  const mv = MOVES[key];
  if (a.flinch) { a.flinch = false; say("sys", `${a.name}は ひるんで うごけない！`); return; }
  if (a.status === "par" && Math.random() < .25) { say("sys", `${a.name}は からだが しびれて うごけない！`); return; }
  if (a.confuse) {
    a.confuse--; say("sys", `${a.name}は こんらん している！`);
    if (a.confuse === 0) say("sys", `${a.name}の こんらんが とけた！`);
    else if (Math.random() < .5) {
      const self = Math.max(1, Math.floor(Math.floor(22*40*a.s.atk/a.s.def)/50)+2);
      const before = a.hp; a.hp = Math.max(0, a.hp - self);
      say("sys", "わけも わからず じぶんを こうげきした！ " + word(self, a, before)); return;
    }
  }
  say("sys", `◎${a.name}の「${mv.name}」！`);
  if (key === "charge") { a.charged = true; a.st.spd = Math.min(6, a.st.spd+1);
    say("sys", `${a.name}は じゅうでんを はじめた！ 特防が あがった！`); return; }
  if (key === "curse") {
    const cost = Math.floor(a.max/2); a.hp = Math.max(0, a.hp - cost); d.cursed = true;
    say("sys", `${a.name}は 自分の体力を削って ${d.name}に のろいを かけた！`); return;
  }
  if (key === "meanlook") { meanLooked = true; say("sys", `${d.name}は もう にげられない！`); return; }
  if (mv.acc && Math.random()*100 >= mv.acc) { say("sys", `${d.name}には 当たらなかった！`); return; }
  const r = damage(a, d, mv);
  if (mv.type === "でんき") a.charged = false;
  if (r.e === 0) { say("sys", `${d.name}には 効果が ないようだ……`); return; }
  let dmg = r.dmg, before = d.hp;
  if (dmg >= d.hp && d.item === "きあいのハチマキ" && Math.random() < .1) {
    dmg = d.hp - 1; d.lastBand = true;
  }
  d.hp = Math.max(0, d.hp - dmg);
  if (r.crit) say("sys", "きゅうしょに あたった！");
  if (r.e > 1) say("sys", "こうかは ばつぐんだ！"); else if (r.e < 1) say("sys", "こうかは いまひとつの ようだ");
  say("sys", word(dmg, d, before));
  if (d.lastBand) { d.lastBand = false; say("sys", `${d.name}は「きあいのハチマキ」で 皮一枚 踏んばった！`); }
  if (!typeKnown && d === E && d.hp > 0) { typeKnown = true; say("talk", "ガッシュ「ウヌ……おぬし、みずタイプか？ それに、どこかゴーストの気配がするのだ」"); }
  if (d.hp > 0 && mv.sec && Math.random()*100 < mv.sec.chance) {
    const s = mv.sec.eff;
    if (s === "flinch") { if (d.ability === "せいしんりょく") { if (key === "fakeout") say("sys", `${d.name}は 特性「せいしんりょく」で ひるまなかった！`); } else d.flinch = true; }
    if (s === "par" && !d.status && !d.types.includes("でんき")) { d.status = "par"; say("sys", `${d.name}は まひして わざが でにくくなった！`); }
    if (s === "spd-1") { d.st.spd = Math.max(-6, d.st.spd-1); say("sys", `${d.name}の 特防が さがった！`); }
    if (s === "confuse" && !d.confuse) { d.confuse = 2 + Math.floor(Math.random()*4); say("sys", `${d.name}は こんらんした！`); }
  }
  if (mv.contact && d.ability === "のろわれボディ" && a.hp > 0 && Math.random() < .5 && !a.disabled) {
    a.disabled = key; a.disabledTurns = 4;
    say("sys", `${d.name}の のろわれボディ！ ${a.name}の「${mv.name}」は ふうじられた！`);
  }
}

// ---- 相手の動き（作者が動かす野生のルサルカのつもりで、見えている範囲で合理的に） ----
function enemyMove(){
  if (firstTurn) return "fakeout";
  if (triedFlee && !meanLooked) return "meanlook";
  const r = E.hp / E.max;
  if (!P.cursed && r > .6 && Math.random() < .3) return "curse";
  const sb = damage(E, P, MOVES.shadowball).dmg, wp = damage(E, P, MOVES.waterpulse).dmg;
  return (sb >= wp ? Math.random() < .75 : Math.random() < .25) ? "shadowball" : "waterpulse";
}

function speedOf(m){ return Math.floor(m.s.spe * mult(m.st.spe) * (m.status === "par" ? .25 : 1)); }

function endOfTurn(){
  for (const m of [P, E]) {
    if (m.hp > 0 && m.cursed) { const c = Math.max(1, Math.floor(m.max/4)), b = m.hp; m.hp = Math.max(0, m.hp - c);
      say("sys", `${m.name}は のろわれている！ ` + word(c, m, b)); }
    if (m.disabled && --m.disabledTurns <= 0) { say("sys", `${m.name}の かなしばりが とけた！`); m.disabled = null; }
  }
}

function checkEnd(){
  if (E.hp <= 0) { over = true; say("sys", "◎――――ルサルカは たおれた！");
    say("talk", "カズマ「よっしゃあ！ 記念すべきポケモンバトル初勝利！！」");
    say("talk", "ガッシュ「こ、これを勝利と数えてよいのかの……？」");
    say("sys", "（このあと、ルサルカは「くろいまなざし」でカズマを逃がさず、料理上手を売りにして仲間になる。）");
    return true; }
  if (P.hp <= 0) { over = true; say("sys", "◎――――ガッシュは たおれた……");
    say("talk", "カズマ「うそだろ、初戦から全滅かよ！？」"); return true; }
  return false;
}

function act(choice){
  if (over) return;
  turn++; say("turn", `T${turn}`);
  P.flinch = false; E.flinch = false;
  if (choice === "flee") {
    triedFlee = true;
    if (meanLooked) { say("sys", "にげられない！ くろいまなざしで 見張られている！"); }
    else if (Math.random() < .5) { over = true; say("sys", "うまく にげきれた！");
      say("talk", "カズマ「……いや、気絶したしぶりん置いてきてるじゃねーか！」"); render(); menu(); return; }
    else { say("sys", "にげられない！"); }
    const ek = enemyMove(); useMove(E, P, ek); firstTurn = false;
    if (!checkEnd()) { endOfTurn(); checkEnd(); }
    render(); menu(); return;
  }
  if (choice === "thunderbolt" && lastMove === "thunderbolt") say("talk", "カズマ「しゃあっ、禁断の「10まんボルト」''二度撃ち''！！！」");
  lastMove = choice;
  const ek = enemyMove();
  const pp = MOVES[choice].prio || 0, ep = MOVES[ek].prio || 0;
  const pFirst = pp !== ep ? pp > ep : (speedOf(P) !== speedOf(E) ? speedOf(P) > speedOf(E) : Math.random() < .5);
  const order = pFirst ? [[P,E,choice],[E,P,ek]] : [[E,P,ek],[P,E,choice]];
  for (const [a, d, k] of order) {
    if (a.hp <= 0 || d.hp <= 0) continue;
    useMove(a, d, k);
    if (checkEnd()) { render(); menu(); return; }
  }
  firstTurn = false;
  endOfTurn(); checkEnd();
  render(); menu();
}

function menu(){
  const box = document.getElementById("cmds"); box.innerHTML = "";
  if (over) { const b = document.createElement("button"); b.className = "wide"; b.textContent = "もう一度";
    b.onclick = setup; box.appendChild(b); return; }
  for (const k of P.moves) {
    const mv = MOVES[k], b = document.createElement("button");
    const info = mv.cat === "st" ? "変化" : `${mv.type}　威力${mv.pow}`;
    b.innerHTML = `${mv.name}<small>${info}</small>`;
    b.disabled = P.disabled === k;
    b.onclick = () => act(k); box.appendChild(b);
  }
  const f = document.createElement("button"); f.className = "wide"; f.textContent = "にげる";
  f.onclick = () => act("flee"); box.appendChild(f);
}

setup();
</script>
</body>
</html>
